# =============================================================
#  Nginx config for IOGT Uzbekistan
#  Place at: /etc/nginx/sites-available/iogt
#  Then symlink to sites-enabled (see guide).
#
#  Replace "iogt.bslab.uz" with your real domain everywhere.
# =============================================================

server {
    listen 80;
    listen [::]:80;
    server_name iogt.bslab.uz;

    # Allow large uploads (images, media)
    client_max_body_size 50M;

    # Proxy everything to the Gunicorn container on localhost:8000
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}

# NOTE: After running certbot (guide step 12) this file will be
# automatically updated to add the HTTPS (443) server block and an
# HTTP->HTTPS redirect. You do not need to edit it by hand.
